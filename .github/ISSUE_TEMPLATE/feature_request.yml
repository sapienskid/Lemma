name: "✨ Feature Request"
description: "Suggest a new feature or enhancement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Lemma better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: "Describe the pain point. E.g. 'I always have to...' or 'It's frustrating that...'"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "Describe your idea. How should it work?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Any other approaches you've thought of or tried?"
  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - "Nice to have"
        - "Would significantly improve my workflow"
        - "Blocking me from using Lemma"
    validations:
      required: true
